# uffizzi-app: REST API (Rails) + Sidekiq. Endpoint used by the Uffizzi CLI.
# Depends on PostgreSQL + Redis (subcharts) and the controller.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uffizzi-app-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: uffizzi
  sources:
    - repoURL: "https://uffizzicloud.github.io/uffizzi"
      chart: uffizzi-app
      targetRevision: "1.3.0"
      helm:
        valueFiles:
          - $values/environments/dev/app-values.yaml
    - repoURL: "https://github.com/brunorossi/ephemeral_cloud_sandboxes.git"
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: eph-env
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
