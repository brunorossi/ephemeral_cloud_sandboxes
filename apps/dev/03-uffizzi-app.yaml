# uffizzi-app: REST API (Rails) + Sidekiq. Endpoint used by the Uffizzi CLI.
# Depends on PostgreSQL + Redis (subcharts) and the controller.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uffizzi-app-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: uffizzi
  sources:
    # VENDORED CHART: served from charts/uffizzi-app in THIS repo. The upstream
    # uffizzi-app 1.3.0 embeds uffizzi-cluster-operator 1.4.5 -> flux 0.3.11 with
    # dead docker.io/bitnami/fluxcd-* images and a hardcoded (unoverridable)
    # gcr.io/kubebuilder/kube-rbac-proxy. The vendored copy makes the embedded
    # operator conditional so it can be disabled (we run 1.6.5 separately via
    # apps/dev/01-uffizzi-cluster-operator.yaml). See charts/README.md.
    - repoURL: "https://github.com/brunorossi/ephemeral_cloud_sandboxes.git"
      targetRevision: main
      path: charts/uffizzi-app
      helm:
        valueFiles:
          - $values/environments/dev/app-values.yaml
    - repoURL: "https://github.com/brunorossi/ephemeral_cloud_sandboxes.git"
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: eph-env
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
