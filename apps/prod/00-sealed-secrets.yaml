# Sealed Secrets controller. Deployed FIRST (sync-wave -3) so that SealedSecret
# resources for other components can be decrypted into eph-env.
#
# NOTE: The controller is deployed into eph-env (matching the AppProject
# destination whitelist). When sealing secrets, target this controller:
#   kubeseal --controller-name sealed-secrets --controller-namespace eph-env ...
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: uffizzi
  source:
    repoURL: "https://bitnami.github.io/sealed-secrets"
    chart: sealed-secrets
    targetRevision: "2.20.0"
    helm:
      values: |
        fullnameOverride: sealed-secrets
        # Controller lives in eph-env (see kubeseal --controller-namespace).
  destination:
    server: https://kubernetes.default.svc
    namespace: eph-env
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
