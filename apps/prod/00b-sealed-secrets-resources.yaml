# SealedSecret RESOURCES for prod. Separate from 00-sealed-secrets.yaml, which
# installs the Sealed Secrets *controller* (Bitnami chart). This Application syncs
# the encrypted SealedSecret manifests in environments/prod/sealed-secrets/ so the
# controller can decrypt them into plaintext Secrets (uffizzi-postgres,
# uffizzi-redis, uffizzi-web-envs, ...) that the Helm charts consume.
#
# sync-wave -2: AFTER the controller (-3) so decryption works, BEFORE the
# cluster-operator (-1), uffizzi-controller (0) and app (1) that reference the
# resulting Secrets via existingSecret/externalSecret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-resources-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: uffizzi
  source:
    repoURL: "https://github.com/brunorossi/ephemeral_cloud_sandboxes.git"
    targetRevision: main
    path: environments/prod/sealed-secrets
    directory:
      recurse: false
      # Skip README.md and any non-manifest files; only apply SealedSecret YAML.
      include: "{uffizzi-*.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: eph-env
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      # First-bootstrap race: this app (wave -2) applies SealedSecret CRs, but the
      # SealedSecret CRD is installed by 00-sealed-secrets (wave -3) seconds earlier.
      # Retry so a transient "no matches for kind SealedSecret" resolves quickly
      # instead of waiting for the next reconcile.
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Tolerate the SealedSecret CRD not being registered yet on first sync.
      - SkipDryRunOnMissingResource=true
