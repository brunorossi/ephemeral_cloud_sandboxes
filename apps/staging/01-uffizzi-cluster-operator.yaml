# uffizzi-cluster-operator: manages UffizziCluster CRDs -> vclusters (ephemeral envs).
# VENDORED CHART: served from charts/uffizzi-cluster-operator in THIS repo. The
# upstream 1.6.5 chart hardcodes a retired gcr.io/kubebuilder/kube-rbac-proxy
# image (no Helm override) and pulls deleted Bitnami fluxcd-* images; the
# vendored copy patches both. See charts/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uffizzi-cluster-operator-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: uffizzi
  source:
    repoURL: "https://github.com/brunorossi/ephemeral_cloud_sandboxes.git"   # <-- REPLACE
    targetRevision: main
    path: charts/uffizzi-cluster-operator
    # No external valueFiles needed: the image fixes (ghcr.io fluxcd + quay.io
    # kube-rbac-proxy) are baked into the vendored chart's own values.yaml.
    # Add a `helm.values`/`valueFiles` block here only for env-specific tuning.
  destination:
    server: https://kubernetes.default.svc
    namespace: eph-env
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
