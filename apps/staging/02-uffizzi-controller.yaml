# uffizzi-controller: smart proxy between the Uffizzi API and the Kubernetes API.
# VENDORED CHART: served from charts/uffizzi-controller in THIS repo. The upstream
# uffizzi-controller 2.4.6 embeds uffizzi-cluster-operator 1.6.5 -> flux with no
# `condition` to disable it, so its Flux ClusterRoles collide with the standalone
# operator (apps/staging/01-uffizzi-cluster-operator.yaml) -> ArgoCD
# RepeatedResourceWarning. The vendored copy adds the `condition` so the embedded
# operator can be turned off via controller-values.yaml. See charts/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uffizzi-controller-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: uffizzi
  sources:
    - repoURL: "https://github.com/brunorossi/ephemeral_cloud_sandboxes.git"
      targetRevision: main
      path: charts/uffizzi-controller
      helm:
        valueFiles:
          - $values/environments/staging/controller-values.yaml
    - repoURL: "https://github.com/brunorossi/ephemeral_cloud_sandboxes.git"
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: eph-env
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
