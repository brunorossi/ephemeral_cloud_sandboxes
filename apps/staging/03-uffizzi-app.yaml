# uffizzi-app: REST API (Rails) + Sidekiq. Endpoint used by the Uffizzi CLI.
# Depends on PostgreSQL + Redis (subcharts) and the controller.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uffizzi-app-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: uffizzi
  sources:
    # VENDORED CHART: see charts/uffizzi-app + charts/README.md. Upstream 1.3.0
    # embeds a redundant operator 1.4.5 -> flux 0.3.11 with dead bitnami/fluxcd-*
    # and hardcoded gcr.io/kubebuilder/kube-rbac-proxy images. Vendored copy makes
    # the embedded operator conditional; disabled via app-values.yaml.
    - repoURL: "https://github.com/brunorossi/ephemeral_cloud_sandboxes.git"
      targetRevision: main
      path: charts/uffizzi-app
      helm:
        valueFiles:
          - $values/environments/staging/app-values.yaml
    - repoURL: "https://github.com/brunorossi/ephemeral_cloud_sandboxes.git"
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: eph-env
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
