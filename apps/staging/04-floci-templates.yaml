# floci-aws / floci-azure vcluster templates (resource-size presets).
# Applies the reference UffizziCluster presets into eph-env. Developers create
# their single vcluster from one of these (see PROJECT.md / README).
#
# NOTE: these are REFERENCE presets containing <username> placeholders. If you
# prefer NOT to have ArgoCD manage literal preset objects, keep this Application
# pointed at the folder for documentation/versioning only, or template per-staging
# copies. Sync is MANUAL to avoid ArgoCD trying to reconcile placeholder names.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: floci-templates-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: uffizzi
  source:
    repoURL: "https://github.com/brunorossi/ephemeral_cloud_sandboxes.git"   # <-- REPLACE
    targetRevision: main
    path: environments/staging/templates
  destination:
    server: https://kubernetes.default.svc
    namespace: eph-env
  # Manual sync: presets contain <username> placeholders and are meant as
  # per-stagingeloper bases, not always-on managed objects.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
