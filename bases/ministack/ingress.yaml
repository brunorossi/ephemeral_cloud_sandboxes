apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Canonical bare name -> "{id}-{env}-{tech}-ingress" after namePrefix.
  name: ingress
spec:
  ingressClassName: traefik
  rules:
  # Two placeholder hosts. Each overlay patches these via ingress-patch.yaml to
  # "{id}.{env}.{tech}.local" and "*.{id}.{env}.{tech}.local".
  - host: placeholder.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            # Bare service name; Kustomize namePrefix rewrites this reference too.
            name: service
            port:
              number: 4566
  - host: "*.placeholder.local"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service
            port:
              number: 4566
