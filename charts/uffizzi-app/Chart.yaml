annotations:
  artifacthub.io/prerelease: "false"
apiVersion: v2
appVersion: 2.3.0
dependencies:
- name: uffizzi-controller
  repository: https://uffizzicloud.github.io/uffizzi_controller/
  version: ^2
- condition: postgresql.enabled
  name: postgresql
  repository: https://charts.bitnami.com/bitnami
  version: ~13
- condition: redis.enabled
  name: redis
  repository: https://charts.bitnami.com/bitnami
  version: ~18
description: Uffizzi is an open-source engine for creating lightweight, ephemeral
  test environments for APIs and full-stack applications. Uffizzi enables teams to
  preview new features before merging.
home: https://uffizzi.com/
icon: https://app.uffizzi.com/favicon.png
keywords:
- devops
- uffizzi
- continuous-previews
- ephemeral
- environments
- pull-request
- merge-request
- on-demand
- ci
- cd
- cp
- idp
kubeVersion: '>= 1.21.0-0'
maintainers:
- email: info@uffizzi.com
  name: Uffizzi
  url: https://uffizzi.com
- email: adam.vollrath@uffizzi.com
  name: Adam Vollrath
  url: https://github.com/axisofentropy
name: uffizzi-app
sources:
- https://github.com/UffizziCloud/uffizzi
type: application
version: 1.3.0
