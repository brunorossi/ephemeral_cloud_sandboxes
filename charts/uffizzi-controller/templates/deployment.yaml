apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Release.Name }}-controller
  name: {{ .Release.Name }}-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-controller
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-controller
    spec:
      automountServiceAccountToken: true
      serviceAccountName: {{ .Release.Name }}-controller
      enableServiceLinks: true
      shareProcessNamespace: false
      containers:
      - envFrom:
        - secretRef:
            name: {{ .Release.Name }}-controller-secret-env
            optional: false
{{- if .Values.externalSecret }}
        # VENDORED PATCH (floci): layer a sealed/external Secret LAST so its keys
        # (CONTROLLER_LOGIN / CONTROLLER_PASSWORD) override the chart-generated
        # controller-secret-env, which otherwise reads Helm-value creds. These MUST
        # match the app side (uffizzi-web-envs CONTROLLER_PASSWORD). See charts/README.md.
        - secretRef:
            name: {{ .Values.externalSecret }}
            optional: false
{{- end }}
        env:
          - name: KUBERNETES_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        image: {{ .Values.image }}
        imagePullPolicy: Always
        name: controller
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      restartPolicy: Always
