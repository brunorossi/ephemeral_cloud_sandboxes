# =============================================================================
# VALUES: uffizzi-app (API) — DEV (HTTP-only)
# =============================================================================
# Secrets (DB, Redis, controller creds, first user) come from SealedSecrets in
# environments/dev/sealed-secrets/. Do NOT put plaintext credentials here.
# Confirm exact keys with `helm show values uffizzi-app/uffizzi-app`.
# =============================================================================

uffizzi:
  firstUser:
    email: "admin@floci.dev.local"      # <-- first admin (password via secret)
    projectName: default
  controller:
    username: uffizzi-controller
    # password: <from SealedSecret>     # MUST match controller-values credentials
  env: production
  app_url: http://api.dev.local          # HTTP (no TLS)
  webHostname: api.dev.local
  image: uffizzi/app
  web-replicas: 1                        # dev: single replica
  sidekiq-replicas: 1
  # In-cluster controller service in eph-env:
  controller_url: "http://uffizzi-controller.eph-env.svc.cluster.local:8080"
  managed_dns_zone_dns_name: dev.local   # ephemeral env DNS zone (local)
  # Minimal OSS setup: keep premium/integration features off
  feature_email_delivery: false
  feature_sentry: false
  feature_stripe: false
  feature_google_maps: false
  feature_mailchimp: false

# Ingress: K3s Traefik, HTTP-only. If the chart does not render an Ingress
# natively, create one under environments/dev/ with:
#   ingressClassName: traefik   (no TLS block)

# Dependencies (dev: in-cluster). Credentials injected via SealedSecret-provided
# Secret; reference it per the chart's existingSecret mechanism where available.
postgresql:
  enabled: true
  # Bitnami relocated tagged images out of docker.io/bitnami (late-2025 "Bitnami
  # Secure Images" migration); the old repo returns "not found". Point at the
  # docker.io/bitnamilegacy mirror which still serves these pinned tags.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.1.0-debian-11-r3
redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.2.3-debian-11-r1

# ---------------------------------------------------------------------------
# VENDORED-CHART PATCH (see charts/uffizzi-app + charts/README.md)
# The uffizzi-app chart embeds uffizzi-controller -> uffizzi-cluster-operator
# (1.4.5) -> flux (0.3.11), which pulls DEAD images:
#   - docker.io/bitnami/fluxcd-helm-controller / -source-controller (migrated away)
#   - gcr.io/kubebuilder/kube-rbac-proxy:v0.13.1 (retired, hardcoded, no override)
# We already run a separately patched uffizzi-cluster-operator 1.6.5 via
# apps/dev/01-uffizzi-cluster-operator.yaml, so the embedded operator is
# redundant. Disable it (requires the `condition` added to the vendored
# uffizzi-controller/Chart.yaml). This removes BOTH the flux images and the
# dead kube-rbac-proxy in one move.
# ---------------------------------------------------------------------------
uffizzi-controller:
  uffizzi-cluster-operator:
    enabled: false

