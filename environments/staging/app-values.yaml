# =============================================================================
# VALUES: uffizzi-app (API) — DEV (HTTP-only)
# =============================================================================
# Secrets (DB, Redis, controller creds, first user) come from SealedSecrets in
# environments/dev/sealed-secrets/. Do NOT put plaintext credentials here.
# Confirm exact keys with `helm show values uffizzi-app/uffizzi-app`.
# =============================================================================

uffizzi:
  firstUser:
    email: "admin@floci.staging.local"      # <-- first admin (password via secret)
    projectName: default
  controller:
    username: uffizzi-controller
    # password: <from SealedSecret>     # MUST match controller-values credentials
  env: production
  app_url: http://api.staging.local          # HTTP (no TLS)
  webHostname: api.staging.local
  image: uffizzi/app
  web-replicas: 1                        # dev: single replica
  sidekiq-replicas: 1
  # In-cluster controller service in eph-env:
  controller_url: "http://uffizzi-controller.eph-env.svc.cluster.local:8080"
  managed_dns_zone_dns_name: staging.local   # ephemeral env DNS zone (local)
  # Minimal OSS setup: keep premium/integration features off
  feature_email_delivery: false
  feature_sentry: false
  feature_stripe: false
  feature_google_maps: false
  feature_mailchimp: false

# Ingress: K3s Traefik, HTTP-only. If the chart does not render an Ingress
# natively, create one under environments/dev/ with:
#   ingressClassName: traefik   (no TLS block)

# Dependencies (dev: in-cluster). Credentials injected via SealedSecret-provided
# Secret; reference it per the chart's existingSecret mechanism where available.
postgresql:
  enabled: true
  # Bitnami relocated tagged images out of docker.io/bitnami (late-2025 migration);
  # use the docker.io/bitnamilegacy mirror which still serves these pinned tags.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.1.0-debian-11-r3
redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.2.3-debian-11-r1

# VENDORED-CHART PATCH (see charts/uffizzi-app + charts/README.md): disable the
# redundant embedded uffizzi-cluster-operator 1.4.5 (we run patched 1.6.5 via
# apps/staging/01-uffizzi-cluster-operator.yaml). Removes the dead flux images
# and the hardcoded gcr.io/kubebuilder/kube-rbac-proxy.
uffizzi-controller:
  uffizzi-cluster-operator:
    enabled: false
