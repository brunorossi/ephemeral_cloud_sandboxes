# =============================================================================
# VALUES: uffizzi-cluster-operator — DEV
# =============================================================================
# Single-node K3s: no node placement/labels needed (all vclusters land on the
# one node). Leave defaults unless the chart requires explicit values.
#
# The floci-aws / floci-azure resource profiles are NOT set here; they are
# applied per-vcluster via environments/dev/templates/*.yaml.
# =============================================================================

# Example knobs (adapt to the chart's actual schema; verify with `helm show values`):
# replicaCount: 1
# image:
#   repository: uffizzi/cluster-operator
#   tag: ""            # <-- pin
# resources: {}

# -----------------------------------------------------------------------------
# Flux subchart image override
# -----------------------------------------------------------------------------
# The bundled Bitnami `flux` subchart defaults to docker.io/bitnami/fluxcd-*
# images. Broadcom's late-2025 "Bitnami Secure Images" migration deleted the
# old public tags from Docker Hub, so those pulls now fail with "not found".
# Point Flux at the upstream, public fluxcd images on ghcr.io instead.
# Verified via: helm template ... | grep 'image:.*flux'
global:
  security:
    # Required: non-Bitnami images bypass Bitnami common's image verification.
    allowInsecureImages: true
flux:
  helmController:
    image:
      registry: ghcr.io
      repository: fluxcd/helm-controller
      tag: v1.3.0        # <-- verify against a version compatible with the operator
  sourceController:
    image:
      registry: ghcr.io
      repository: fluxcd/source-controller
      tag: v1.6.2        # <-- verify
