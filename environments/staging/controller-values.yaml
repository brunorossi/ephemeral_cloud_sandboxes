# =============================================================================
# VALUES: uffizzi-controller — DEV (HTTP-only)
# =============================================================================
# No TLS: cert-manager and any ClusterIssuer are disabled. Ingress via Traefik.
# Confirm exact keys with `helm show values uffizzi-controller/uffizzi-controller`.
# =============================================================================

# HTTP-only ingress through K3s Traefik
ingress:
  hostname: api.staging.local        # <-- API/controller hostname (HTTP)
  className: traefik             # route the controller Ingress through Traefik

# Disable TLS/cert issuance entirely
clusterIssuer: ""                # no cert-manager issuer
certEmail: ""                    # not used (no ACME)
cert-manager:
  enabled: false                 # do not install cert-manager as a dependency
  installCRDs: false

image: uffizzi/controller:latest # <-- pin an exact tag
env: "production"
sandbox: "false"
podCidr: 10.42.0.0/16            # K3s default pod CIDR (verify on the node)

# ---------------------------------------------------------------------------
# VENDORED-CHART PATCH (see charts/uffizzi-controller + charts/README.md)
# The uffizzi-controller chart embeds uffizzi-cluster-operator 1.6.5 -> flux.
# We already run a separately patched uffizzi-cluster-operator 1.6.5 via
# apps/<env>/01-uffizzi-cluster-operator.yaml, so the embedded operator is
# redundant and its Flux ClusterRoles collide with the standalone operator
# (ArgoCD RepeatedResourceWarning on
# .../flux-eph-env-source-controller-gitreposi). Disable it here (requires the
# `condition` added to the vendored uffizzi-controller/Chart.yaml).
# ---------------------------------------------------------------------------
uffizzi-cluster-operator:
  enabled: false

# ---------------------------------------------------------------------------
# VENDORED-CHART PATCH: disable embedded ingress-nginx (see charts/README.md).
# floci is Traefik-only / HTTP-only (spec Requirement 3). The controller chart
# embeds ingress-nginx with a `type: LoadBalancer` Service and an IngressClass
# named `uffizzi`, which on single-node K3s cannot get an external IP and
# collides with Traefik on ports 80/443 -> the
# uffizzi-controller-<env>-ingress-nginx-controller pod hangs. Nothing in floci
# uses the nginx class: the API and every vcluster template pin
# `ingressClassName: traefik`. Disable it (requires the `condition` added to
# the vendored uffizzi-controller/Chart.yaml).
# ---------------------------------------------------------------------------
ingress-nginx:
  enabled: false

# Controller <-> app shared credentials come from a SealedSecret (see
# environments/staging/sealed-secrets/). These MUST match the app side
# (uffizzi-web-envs CONTROLLER_PASSWORD). The vendored controller deployment
# layers `externalSecret` LAST in envFrom, overriding the chart-generated
# controller-secret-env. Provide it as a SealedSecret with env-var-named keys
# CONTROLLER_LOGIN / CONTROLLER_PASSWORD.
externalSecret: uffizzi-controller-env
