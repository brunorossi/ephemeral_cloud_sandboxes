apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay: id "brossi", env "dev", tech "floci-gcp".
# namePrefix makes every resource name start with "brossi-dev-floci-gcp-".
namePrefix: brossi-dev-floci-gcp-

resources:
  - ../../../bases/floci-gcp

labels:
  - pairs:
      owner: brossi
      env: dev
      tech: floci-gcp
    includeSelectors: false

patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: ingress
