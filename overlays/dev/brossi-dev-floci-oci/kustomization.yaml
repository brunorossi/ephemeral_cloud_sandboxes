apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay: id "brossi", env "dev", tech "floci-oci".
# namePrefix makes every resource name start with "brossi-dev-floci-oci-".
namePrefix: brossi-dev-floci-oci-

resources:
  - ../../../bases/floci-oci

labels:
  - pairs:
      owner: brossi
      env: dev
      tech: floci-oci
    includeSelectors: false

patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: ingress
