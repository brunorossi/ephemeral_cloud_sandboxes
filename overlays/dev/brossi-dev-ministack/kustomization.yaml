apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay: id "brossi", env "dev", tech "ministack".
# namePrefix makes every resource name start with the namespace name
# "brossi-dev-ministack-": data-pvc -> brossi-dev-ministack-data-pvc,
# deployment -> brossi-dev-ministack-deployment, service -> ...-service,
# ingress -> ...-ingress. Name references (claimName, ingress backend) are
# rewritten by Kustomize automatically.
namePrefix: brossi-dev-ministack-

resources:
  - ../../../bases/ministack

labels:
  - pairs:
      owner: brossi
      env: dev
      tech: ministack
    includeSelectors: false

# Patch the ingress hosts to "{id}.{env}.{tech}.local" (+ wildcard).
patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: ingress
