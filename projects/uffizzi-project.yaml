# ArgoCD AppProject for Uffizzi.
# Added into the EXISTING argocd namespace (ArgoCD is a prerequisite, not managed here).
# Restricts source repos and destination namespaces for safety.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: uffizzi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Uffizzi self-hosted (app-of-apps) on single-node K3s + Traefik (HTTP-only)
  sourceRepos:
    # This GitOps repo
    - "https://github.com/brunorossi/ephemeral_cloud_sandboxes.git"   
    - "https://uffizzicloud.github.io/uffizzi"
    - "https://uffizzicloud.github.io/uffizzi_controller/" 
    - "https://uffizzicloud.github.io/uffizzi-cluster-operator"
    - "https://bitnami.github.io/sealed-secrets"
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: eph-env
      server: https://kubernetes.default.svc
    # The uffizzi-app chart bundles cert-manager (transitive dependency via
    # uffizzi-controller). cert-manager renders leader-election Role/RoleBinding
    # into kube-system, which cannot be disabled (no `condition` on the dep).
    # Permit kube-system so ArgoCD can sync those resources.
    - namespace: kube-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    # CRDs (UffizziCluster, SealedSecret) require cluster-scoped access
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
